name: Release

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: none
    if: (github.event_name == 'release')
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/publish_pure_python.yml@8d5ad7efc8e84a051639373f6ea0d10441eafee1  # v3.2.1
    with:
      upload_to_pypi: false
      save_artifacts: true
      test_extras: test
      test_command: pytest --pyargs asdf_astropy

  upload:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          merge-multiple: true
          pattern: dist-*
          path: dist
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
